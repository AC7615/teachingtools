function lifeQuestion(s){return {text:`${s.life}像哪一种立体？`,art:'',options:shuffle(shapes.filter(x=>x.type==='solid'&&x.id!==s.id)).slice(0,3).concat(s).map(x=>({value:x.id,label:x.name,shape:x.id})),answer:s.id,review:`${s.life}像${s.name}`}}
function patternQuestion(){const ids=shuffle(shapes.filter(s=>s.type==='plane').map(s=>s.id)),a=ids[0],b=ids[1],c=ids[2],patterns=[[a,b,a,b,a,b],[a,a,b,a,a,b],[a,b,c,a,b,c]],pattern=patterns[Math.floor(Math.random()*patterns.length)],answer=pattern[5];return {text:'接下来是什么图形？',pattern:true,art:pattern.slice(0,5).map(id=>svg(id,byId(id).name)).join('')+'<span class="unknown">?</span>',options:ids.map(id=>({value:id,label:byId(id).name,shape:id})),answer,review:`接下来是${byId(answer).name}`}}

function reverseNameQuestion(s){return {text:`哪一个是${s.name}？`,art:'',options:shuffle(shapes.filter(x=>x.type===s.type&&x.id!==s.id)).slice(0,3).concat(s).map((x,i)=>({value:x.id,label:['A','B','C','D'][i],shape:x.id})),answer:s.id,review:`要找的是${s.name}`}}
function whichFeatureQuestions(type){const pool=shapes.filter(s=>s.type===type),questions=[];for(const prop of type==='plane'?['vertices','edges']:['vertices','flat']){const valueFor=s=>prop==='flat'?flatCounts[s.id]:s[prop],values=[...new Set(pool.filter(s=>!(s.id==='circle'&&prop==='edges')).map(valueFor))];for(const n of values){const right=shuffle(pool.filter(s=>valueFor(s)===n&&!(s.id==='circle'&&prop==='edges')))[0],wrong=shuffle(pool.filter(s=>valueFor(s)!==n&&!(s.id==='circle'&&prop==='edges'))).slice(0,3);if(!right||wrong.length<3)continue;questions.push({text:`哪一个有 ${n} ${prop==='edges'?'条边':prop==='flat'?'个平面':'个顶点'}？`,art:'',options:wrong.concat(right).map((s,i)=>({value:s.id,label:['A','B','C','D'][i],shape:s.id})),answer:right.id,review:`${right.name}有 ${n} ${prop==='edges'?'条边':prop==='flat'?'个平面':'个顶点'}`})}}return questions}
function bank(level){const names=shapes.map(nameQuestion),reverse=shapes.map(reverseNameQuestion),plane=featureBank('plane'),solid=featureBank('solid'),planeWhich=whichFeatureQuestions('plane'),solidWhich=whichFeatureQuestions('solid'),rotated=shapes.filter(s=>s.type==='plane').map(s=>({...nameQuestion(s),art:svg(s.id,'待辨认的图形').replace('<svg ','<svg style="transform:rotate(25deg)" ')}));return level==='easy'?[...names,...reverse,...plane,...rotated,...planeWhich]:level==='medium'?[...plane,...solid.filter(q=>!q.text.includes('边')),...planeWhich,...solidWhich,...shapes.filter(s=>s.life&&s.id!=='pyramid').map(lifeQuestion)]:[...plane,...solid,...planeWhich,...solidWhich,...reverse,...rotated,...Array.from({length:16},patternQuestion)]}

function showFeature(){const s=byId(featureShape),props=availableProps(s);if(!props.includes(featureProp))featureProp=props[0];document.getElementById('featureShapes').replaceChildren();shapes.filter(x=>x.type===featureType).forEach(x=>{const b=document.createElement('button');b.innerHTML=svg(x.id,x.name)+x.name;b.classList.toggle('active',x.id===s.id);b.onclick=()=>{stopSpin();featureShape=x.id;featureRevealed=false;yaw=.55;pitch=-.3;showFeature()};document.getElementById('featureShapes').append(b)});document.getElementById('featureName').textContent=s.name;renderFeatureArt();document.getElementById('rotateControls').classList.toggle('hidden',s.type!=='solid');document.getElementById('featureProperties').replaceChildren();props.forEach(p=>{const b=document.createElement('button');b.textContent=featureLabels[p];b.classList.toggle('active',p===featureProp);b.onclick=()=>{featureProp=p;featureRevealed=false;showFeature()};document.getElementById('featureProperties').append(b)});document.getElementById('featureExplain').textContent=featureDescription(s,featureProp);document.getElementById('featureHint').textContent=s.type==='solid'?'拖动立体，看看背后和底下。方向键也能旋转。'+(s.id==='pyramid'?'这个正方棱锥体的底下是正方形。':'')+(featureProp==='vertices'||featureProp==='edges'?'藏在后面的也要数进去。':''):'';document.getElementById('featureCount').textContent=featureRevealed?featureAnswer(s,featureProp):'';document.getElementById('revealFeature').textContent=featureRevealed?'收起答案':'显示答案'}
const viewer=document.getElementById('featureArt');viewer.onpointerdown=e=>{if(featureType!=='solid')return;stopSpin();dragState={x:e.clientX,y:e.clientY};viewer.setPointerCapture(e.pointerId)};viewer.onpointermove=e=>{if(!dragState)return;yaw+=(e.clientX-dragState.x)*.012;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-dragState.y)*.012));dragState={x:e.clientX,y:e.clientY};renderFeatureArt()};viewer.onpointerup=viewer.onpointercancel=()=>{dragState=null};viewer.onkeydown=e=>{if(featureType!=='solid')return;const d={ArrowLeft:[-.15,0],ArrowRight:[.15,0],ArrowUp:[0,-.15],ArrowDown:[0,.15]}[e.key];if(d){e.preventDefault();stopSpin();yaw+=d[0];pitch=Math.max(-1.5,Math.min(1.5,pitch+d[1]));renderFeatureArt()}};
function spinTick(time){if(!spinning)return;if(!document.getElementById('create').classList.contains('active-panel')||document.hidden){stopSpin();return}if(spinTime)yaw+=Math.min(time-spinTime,50)*.00055;spinTime=time;renderFeatureArt();spinFrame=requestAnimationFrame(spinTick)}
document.getElementById('spin').onclick=()=>{if(spinning){stopSpin();return}spinning=true;document.getElementById('spin').textContent='⏸ 暂停转动';spinFrame=requestAnimationFrame(spinTick)};document.getElementById('resetView').onclick=()=>{stopSpin();yaw=.55;pitch=-.3;renderFeatureArt()};document.getElementById('revealFeature').onclick=()=>{featureRevealed=!featureRevealed;showFeature();sound()};
document.querySelectorAll('[data-feature-type]').forEach(b=>b.onclick=()=>{stopSpin();featureType=b.dataset.featureType;featureShape=shapes.find(s=>s.type===featureType).id;featureRevealed=false;document.querySelectorAll('[data-feature-type]').forEach(x=>x.classList.toggle('active',x===b));showFeature()});document.getElementById('goPet').onclick=()=>document.querySelector('[data-panel="game"]').click();
function featureBank(type){const list=shapes.filter(s=>s.type===type),questions=list.flatMap(s=>availableProps(s).filter(p=>['edges','vertices'].includes(p)&&s.id!=='circle').map(p=>countQuestion(s,p)));for(const s of list){if(type==='solid')questions.push({text:'有几个平面？',art:svg(s.id,s.name),options:shuffle([...new Set([0,1,2,3,5,6])].filter(n=>n!==flatCounts[s.id])).slice(0,3).concat(flatCounts[s.id]).map(n=>({value:String(n),label:String(n)})),answer:String(flatCounts[s.id]),review:`${s.name}有 ${flatCounts[s.id]} 个平面`},{text:'有曲面吗？',art:svg(s.id,s.name),options:[{value:'yes',label:'有曲面'},{value:'no',label:'没有曲面'}],answer:s.faces===undefined?'yes':'no',review:s.faces===undefined?`${s.name}有曲面`:`${s.name}没有曲面`})}if(type==='plane')questions.push({text:'哪一个的边是弯弯的？',art:'',options:list.map(s=>({value:s.id,label:s.name,shape:s.id})),answer:'circle',review:'圆形的边是弯弯的'},{text:'哪一个的 4 条边一样长？',art:'',options:list.map(s=>({value:s.id,label:s.name,shape:s.id})),answer:'square',review:'正方形的 4 条边一样长'});return questions}
const API_URL='https://script.google.com/macros/s/AKfycbywytTHCDjJnRskGaP-Ls2Q4XLZMwWnl0MAofy-zyH6qjPNEb9WmNKQzMIPjStd4y0H/exec',UNIT='单元7：空间',COIN_UNIT='单元7：空间',SESSION_KEY='year1MathAccess';let session=null;
try{session=JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null')}catch(_){}if(!session)try{session=window.name.startsWith(SESSION_KEY+':')?JSON.parse(window.name.slice(SESSION_KEY.length+1)):null}catch(_){}
const classMode=!!(session?.mode==='class'&&session.sessionToken&&session.student);document.getElementById('studentDisplay').textContent=classMode?`✅ ${session.student.cn}｜${session.student.en}`:'🌍 公开练习｜成绩不记录';document.getElementById('leaderTab').classList.toggle('hidden',!classMode);
async function api(payload){const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,unit:payload.unit||UNIT,sessionToken:session?.sessionToken})});const data=await res.json();if(!res.ok||data.error)throw new Error(data.error||'network');return data}
async function saveResult(result,statusId){const status=document.getElementById(statusId);if(!classMode){status.textContent='公开练习：成绩未记录';return}status.textContent='正在保存成绩…';try{const data=await api({action:'save',...result});status.textContent=data.saved?'✅ 已更新最高成绩':'成绩已收到；最高分保持不变'}catch(e){status.textContent=e.message==='session_invalid'?'登录已过期，请回主页登录':'成绩未保存，请稍后重试';const b=document.createElement('button');b.textContent='重试保存';b.onclick=()=>saveResult(result,statusId);status.append(b)}}
function esc(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadLeaders(){if(!classMode)return;const status=document.getElementById('leaderStatus'),content=document.getElementById('leaderContent');status.textContent='正在读取…';content.replaceChildren();try{const data=await api({action:'leaderboard',unit:UNIT});for(const [title,rows,isCoins] of [['🪙 硬币闯关最高分',data.gameLeaderboard||[],true],['🎫 离堂小检核',data.ticketLeaderboard||[],false]]){const section=document.createElement('div');section.innerHTML=`<h3>${title}</h3>`+(rows.length?`<div class="table-wrap"><table><thead><tr><th>排名</th><th>学生</th>${isCoins?'<th>简单</th><th>中等</th><th>困难</th>':''}<th>${isCoins?'最高硬币积分':'最高分'}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.rank)}</td><td>${esc(r.name)}</td>${isCoins?['easy','medium','hard'].map(k=>`<td>${esc(r[k]??'—')}</td>`).join(''):''}<td>${esc(r.score)}</td></tr>`).join('')}</tbody></table></div>`:'<p>还没有成绩，完成挑战或离堂检核后会显示在这里。</p>');content.append(section)}status.textContent=''}catch(e){status.textContent=e.message==='session_invalid'?'登录已过期，请回主页登录':'暂时无法读取排行榜'}}document.getElementById('refresh').onclick=loadLeaders;
