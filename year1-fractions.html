<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一年级数学｜分数图片闪卡</title>
<style>
:root{
  --ink:#24324a;--muted:#6d7484;--paper:#fffdf8;--peach:#ff8b65;
  --purple:#6f74ef;--green:#57b777;--line:#e9e5dc;--shadow:0 16px 40px rgba(54,62,92,.12)
}
*{box-sizing:border-box}
body{
  margin:0;color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  background:linear-gradient(160deg,#fff4e6 0%,#f7f8ff 55%,#edfbf3 100%);min-height:100vh
}
button{font:inherit}
.app{width:min(940px,100%);margin:auto;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-size:clamp(25px,5vw,39px);margin:0}.subtitle{color:var(--muted);margin-top:5px;font-weight:650}
.badge{background:#fff;border:1px solid var(--line);border-radius:99px;padding:9px 14px;font-weight:800}
.tabs{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}
.tab,.control,.again{
  border:0;border-radius:15px;padding:12px 18px;background:#fff;color:var(--ink);font-weight:850;
  cursor:pointer;box-shadow:0 2px 0 rgba(36,50,74,.09)
}
.tab.active,.control.primary,.again{background:var(--purple);color:#fff}
.panel{display:none}.panel.active{display:block}

/* 学生身份 */
.identity-card{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px 16px;margin-bottom:17px;box-shadow:0 5px 16px rgba(55,62,90,.06)}
.id-entry{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.id-entry label{font-weight:950}.id-entry input{width:145px;border:2px solid #d9dce7;border-radius:11px;padding:9px 11px;font-size:17px;outline:none}.id-entry input:focus{border-color:var(--purple)}
.lookup-btn{border:0;border-radius:11px;padding:10px 13px;background:var(--purple);color:#fff;font-weight:900;cursor:pointer}
.student-display{font-size:18px;font-weight:950;color:#24713b;min-height:26px}.student-display.error{color:#c34b45}
.anonymous-label{display:flex;gap:8px;align-items:center;font-weight:850;color:#6b557d;cursor:pointer}.anonymous-label input{width:19px;height:19px}

/* 闪卡 */
.flash-shell{background:rgba(255,255,255,.58);border:1px solid var(--line);border-radius:26px;padding:18px}
.scene{height:440px;perspective:1200px;cursor:pointer;outline:none}
.flashcard{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.75,.25,1)}
.flashcard.flipped{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;
  border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);display:flex;align-items:center;
  justify-content:center;text-align:center;padding:25px;overflow:hidden
}
.back{transform:rotateY(180deg);flex-direction:column;background:linear-gradient(145deg,#fff 0%,#fff8e9 100%)}
.counter{position:absolute;right:18px;top:15px;color:var(--muted);font-weight:800}
.flip-hint{position:absolute;bottom:14px;color:#8a8fa0;font-size:14px;font-weight:750}
.answer-name{font-size:clamp(42px,9vw,68px);font-weight:950;margin:0}
.answer-number{font-size:clamp(32px,7vw,49px);color:var(--purple);font-weight:950;margin:2px 0 4px}
.answer-note{font-size:clamp(20px,4vw,27px);font-weight:850;background:#fff;border:2px solid #f1d58f;border-radius:17px;padding:10px 20px}
.back-picture{margin:0 0 6px}.back-picture .picture{width:135px;height:135px}
.controls{display:flex;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}
.control{border:1px solid var(--line);flex:1 1 120px}

/* 单一完整物体的插画式分数图片 */
.picture{width:260px;height:260px;display:flex;align-items:center;justify-content:center;position:relative}
.picture.small{width:124px;height:124px}
.food-object{
  --active:#ffd76a;--empty:#fff8e9;--edge:#d89539;
  width:88%;height:88%;display:grid;overflow:hidden;position:relative;background:var(--empty);
  border:8px solid var(--edge);box-shadow:0 12px 0 rgba(95,61,30,.16),0 16px 23px rgba(66,54,40,.12),inset 0 0 0 4px rgba(255,255,255,.38)
}
.food-object.round{border-radius:50%}.food-object.rect{height:70%;border-radius:28px}
.food-object.parts-1{grid-template-columns:1fr}
.food-object.parts-2{grid-template-columns:repeat(2,1fr)}
.food-object.parts-4{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}
.food-part{min-width:0;position:relative;display:flex;align-items:center;justify-content:center;background:var(--active)}
.food-part.empty{background:var(--empty)}
.food-object.parts-2 .food-part:first-child{border-right:3px dashed #747474}
.food-object.parts-4 .food-part:nth-child(odd){border-right:3px dashed #747474}
.food-object.parts-4 .food-part:nth-child(-n+2){border-bottom:3px dashed #747474}
.food-mark{white-space:pre;text-align:center;font-size:clamp(24px,5vw,39px);line-height:1.25;filter:drop-shadow(0 3px 1px rgba(60,42,28,.14))}
.food-part.empty .food-mark{visibility:hidden}
.food-object.pizza{--active:#ffd96c;--empty:#fff7e8;--edge:#d99538}
.food-object.cake{--active:#ffb5c5;--empty:#fff2f4;--edge:#cc7c83}
.food-object.watermelon{--active:#ff7f87;--empty:#fff2ed;--edge:#62ad65}
.food-object.chocolate{--active:#a86643;--empty:#f5ece7;--edge:#72412d}
.food-object.orange{--active:#ffad3f;--empty:#fff4df;--edge:#e38324}
.food-object.pie{--active:#c68ce7;--empty:#f8f0fa;--edge:#b77a45}
.food-object.sandwich{--active:#f7cf69;--empty:#fff8e9;--edge:#c88c42}
.food-object::after{content:"";position:absolute;inset:6px;border:2px solid rgba(255,255,255,.5);border-radius:inherit;pointer-events:none}
.picture.small .food-object,.back-picture .food-object{border-width:5px;box-shadow:0 6px 0 rgba(95,61,30,.13),0 8px 12px rgba(66,54,40,.09)}
.picture.small .food-mark,.back-picture .food-mark{font-size:17px}
.picture.small .food-object.parts-2 .food-part:first-child,.back-picture .food-object.parts-2 .food-part:first-child{border-right-width:2px}
.picture.small .food-object.parts-4 .food-part:nth-child(odd),.back-picture .food-object.parts-4 .food-part:nth-child(odd){border-right-width:2px}
.picture.small .food-object.parts-4 .food-part:nth-child(-n+2),.back-picture .food-object.parts-4 .food-part:nth-child(-n+2){border-bottom-width:2px}

/* 配对游戏 */
.game-card{background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:25px;padding:20px;box-shadow:var(--shadow)}
.difficulty-box{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px;padding:12px;background:#f5f6fb;border-radius:16px}
.difficulty-btn{border:2px solid transparent;border-radius:12px;padding:9px 13px;background:#fff;color:var(--ink);font-weight:900;cursor:pointer}
.difficulty-btn.active{border-color:var(--purple);background:#eceeff;color:#4d52c9}
.game-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.game-title{font-size:clamp(22px,5vw,30px);font-weight:950}.instruction{color:var(--muted);font-weight:800}
.status-row{display:flex;gap:8px;flex-wrap:wrap}.score-pill,.group-pill{background:#eef8f0;color:#24713b;border-radius:99px;padding:9px 14px;font-weight:900}
.group-pill{background:#fff4db;color:#8a5a00}
.match-board{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}
.match-column{display:grid;gap:11px}
.match-item{
  min-height:145px;background:#fff;border:3px solid transparent;border-radius:14px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;transition:transform .16s,border-color .16s,background .16s;box-shadow:0 5px 16px rgba(55,62,90,.08)
}
.match-item:hover{transform:translateY(-2px)}.match-item.selected{border-color:var(--purple);background:#f0f1ff;transform:scale(1.02)}
.match-item.matched{border-color:var(--green);background:#ebfaef;cursor:default;animation:pop .32s ease}
.match-item.wrong{border-color:#ef6d67;background:#fff0ef;animation:shake .3s}
.word-label{font-size:clamp(26px,5vw,39px);font-weight:950;color:var(--purple)}
.fraction-stack{display:inline-grid;grid-template-rows:auto 3px auto;min-width:1.3em;text-align:center;vertical-align:middle;font-weight:950;line-height:1}
.fraction-stack .top,.fraction-stack .bottom{padding:2px 6px}.fraction-stack .line{height:3px;background:currentColor;width:100%}
.answer-number .fraction-stack{font-size:47px}.fraction-label .fraction-stack{font-size:clamp(34px,7vw,51px);color:var(--purple)}
.game-shape{--fill:#ff8b65;width:112px;height:112px;display:grid;overflow:hidden;border:5px solid #39435b;background:#fff}
.game-shape.circle{border-radius:50%}.game-shape.square{border-radius:0}
.game-shape.parts-2{grid-template-columns:repeat(2,1fr)}
.game-shape.parts-4{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}
.shape-part{background:var(--fill)}.shape-part.empty{background:#fff}
.game-shape.parts-2 .shape-part:first-child{border-right:3px dashed #566074}
.game-shape.parts-4 .shape-part:nth-child(odd){border-right:3px dashed #566074}
.game-shape.parts-4 .shape-part:nth-child(-n+2){border-bottom:3px dashed #566074}
.game-message{text-align:center;min-height:38px;margin-top:14px;font-size:21px;font-weight:900}
.finish{text-align:center;padding:24px}.stars{font-size:48px}.finish h2{font-size:32px;margin:7px}.hidden{display:none!important}

/* 离堂小检核 */
.ticket-card{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:25px;padding:24px;box-shadow:var(--shadow)}
.ticket-intro{text-align:center;max-width:560px;margin:auto;padding:18px}.ticket-icon{font-size:64px}
.ticket-intro h2,.ticket-result h2{font-size:clamp(28px,6vw,38px);margin:7px 0}.ticket-intro p{color:var(--muted);font-size:19px;font-weight:750}
.name-box{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.name-box label{font-weight:900;font-size:20px}.name-box input{width:min(290px,100%);border:2px solid #d9dce7;border-radius:12px;padding:12px 14px;font-size:19px;outline:none}
.name-box input:focus{border-color:var(--purple)}
.ticket-progress{display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:900;margin-bottom:12px}
.ticket-bar{height:11px;background:#e7e9f1;border-radius:99px;overflow:hidden;margin-bottom:18px}.ticket-bar-fill{height:100%;width:25%;background:var(--purple);transition:width .25s}
.ticket-prompt{text-align:center;font-size:24px;font-weight:950;margin:6px 0 12px}
.ticket-stimulus{min-height:145px;display:flex;align-items:center;justify-content:center;background:#f8f8fc;border:2px solid #ececf3;border-radius:18px;margin-bottom:15px}
.ticket-options{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.ticket-option{min-height:86px;border:3px solid transparent;border-radius:14px;background:#fff;box-shadow:0 4px 13px rgba(55,62,90,.09);cursor:pointer;color:var(--ink)}
.ticket-option.selected{border-color:var(--purple);background:#eff0ff}.ticket-option .word-label{font-size:clamp(23px,5vw,34px)}
.ticket-actions{display:flex;justify-content:flex-end;margin-top:16px}.ticket-actions button:disabled{opacity:.4;cursor:not-allowed}
.ticket-result{text-align:center;padding:18px}.ticket-score{font-size:62px;font-weight:950;color:var(--purple);margin:8px}.ticket-status{display:inline-block;border-radius:99px;padding:10px 18px;background:#eaf8ee;color:#24713b;font-size:22px;font-weight:950}
.ticket-detail{font-size:18px;font-weight:800;margin:15px 0;color:var(--muted)}

/* 排行榜 */
.leader-grid{display:grid;gap:18px}.leader-card{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:25px;padding:22px;box-shadow:var(--shadow)}
.leader-head{display:flex;align-items:center;justify-content:space-between;gap:13px;flex-wrap:wrap;margin-bottom:15px}.leader-title{font-size:clamp(28px,6vw,38px);font-weight:950}.leader-note{color:var(--muted);font-weight:800}
.refresh-btn{border:0;border-radius:12px;padding:10px 14px;background:var(--purple);color:#fff;font-weight:900;cursor:pointer}
.leader-status{text-align:center;padding:25px;color:var(--muted);font-weight:850}
.leader-table-wrap{overflow-x:auto}
.leader-table{width:100%;border-collapse:separate;border-spacing:0 8px}.leader-table th{text-align:left;padding:8px 12px;color:var(--muted)}
.leader-table td{background:#f8f8fc;padding:13px 12px;font-weight:850}.leader-table td:first-child{border-radius:12px 0 0 12px;font-size:23px;text-align:center}.leader-table td:last-child{border-radius:0 12px 12px 0}
.leader-table tr.top1 td{background:#fff3c7}.leader-table tr.top2 td{background:#eef1f7}.leader-table tr.top3 td{background:#ffe5d4}.leader-score{font-size:22px;color:var(--purple);font-weight:950}
.difficulty-score{text-align:center}.weight-note{display:inline-block;margin-top:6px;padding:6px 10px;background:#f0f1ff;color:#5055bf;border-radius:10px;font-size:14px;font-weight:850}
.save-status{font-size:14px;font-weight:800;color:var(--muted);margin-top:7px;text-align:center}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pop{50%{transform:scale(1.07)}}
@media(max-width:600px){
  .app{padding:13px}.scene{height:390px}.picture{width:220px;height:220px}.face{padding:18px}
  .identity-card{padding:11px}.id-entry{width:100%}.student-display{width:100%}.game-card,.ticket-card,.leader-card{padding:13px}.match-board{gap:9px}.match-column{gap:9px}.match-item{min-height:121px}.picture.small{width:104px;height:104px}.game-shape{width:92px;height:92px}.ticket-options{gap:8px}.ticket-option{min-height:78px}.leader-table th,.leader-table td{padding:10px 6px;font-size:14px}
}
@media(prefers-reduced-motion:reduce){.flashcard,.match-item{transition:none}.match-item{animation:none!important}}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <div><h1>🍉 一年级数学｜分数</h1><div class="subtitle">看图片 · 翻闪卡 · 玩配对</div></div>
    <div class="badge">单元 3</div>
  </header>

  <nav class="tabs" aria-label="学习活动">
    <button class="tab active" data-target="flash">🃏 图片闪卡</button>
    <button class="tab" data-target="game">🎮 配对游戏</button>
    <button class="tab" data-target="ticket">🎫 离堂小检核</button>
    <button class="tab" data-target="leaderboard">🏆 排行榜</button>
  </nav>

  <div class="identity-card">
    <div class="id-entry">
      <label for="studentNo">序号</label>
      <input id="studentNo" inputmode="numeric" maxlength="2" placeholder="1–38">
      <button class="lookup-btn" id="lookupStudent">确认</button>
    </div>
    <div class="student-display" id="studentDisplay">请先输入序号</div>
    <label class="anonymous-label"><input type="checkbox" id="anonymousMode">不记名练习（教师使用）</label>
  </div>

  <section id="flash" class="panel active">
    <div class="flash-shell">
      <div class="scene" id="scene" role="button" tabindex="0" aria-label="点击翻开答案">
        <div class="flashcard" id="flashcard">
          <div class="face front">
            <div class="counter" id="frontCounter"></div>
            <div id="frontPicture"></div>
            <div class="flip-hint">👆 翻一翻</div>
          </div>
          <div class="face back">
            <div class="counter" id="backCounter"></div>
            <div class="answer-name" id="answerName"></div>
            <div class="answer-number" id="answerNumber"></div>
            <div class="back-picture" id="backPicture"></div>
            <div class="answer-note" id="answerNote"></div>
            <div class="flip-hint">👆 看图片</div>
          </div>
        </div>
      </div>
      <div class="controls">
        <button class="control" id="prev">← 上一张</button>
        <button class="control" id="shuffleCards">🔀 随机打乱</button>
        <button class="control primary" id="next">下一张 →</button>
      </div>
    </div>
  </section>

  <section id="game" class="panel">
    <div class="game-card" id="gameCard">
      <div class="difficulty-box" aria-label="选择难度">
        <button class="difficulty-btn active" data-level="easy">🌱 简单｜图配文字</button>
        <button class="difficulty-btn" data-level="medium">🌿 中等｜图配数字</button>
        <button class="difficulty-btn" data-level="hard">🌳 困难｜文字配数字</button>
      </div>
      <div class="game-top">
        <div><div class="game-title">找一找，配一配！</div><div class="instruction" id="instruction">点图形，再点分数文字。</div></div>
        <div class="status-row"><div class="group-pill" id="groupPill">第 1 / 10 组</div><div class="score-pill" id="scorePill">⭐ 0 / 4</div></div>
      </div>
      <div id="board" class="match-board"></div>
      <div id="gameMessage" class="game-message" aria-live="polite"></div>
      <div id="finish" class="finish hidden">
        <div class="stars">🌟🌟🌟</div><h2>这一组完成！</h2><p id="finishText">还有 9 组，加油！</p>
        <div class="save-status" id="gameSaveStatus"></div>
        <button class="again" id="again">下一组 →</button>
      </div>
    </div>
  </section>

  <section id="ticket" class="panel">
    <div class="ticket-card">
      <div id="ticketIntro" class="ticket-intro">
        <div class="ticket-icon">🎫</div>
        <h2>离堂小检核</h2>
        <p>4 题 · 约 2 分钟</p>
        <div class="student-display" id="ticketStudent">请先在上方输入序号</div>
        <button class="again" id="startTicket">开始 →</button>
      </div>
      <div id="ticketQuiz" class="hidden">
        <div class="ticket-progress"><span id="ticketCount">第 1 / 4 题</span><span>🎫 离堂小检核</span></div>
        <div class="ticket-bar"><div class="ticket-bar-fill" id="ticketBar"></div></div>
        <div class="ticket-prompt" id="ticketPrompt"></div>
        <div class="ticket-stimulus" id="ticketStimulus"></div>
        <div class="ticket-options" id="ticketOptions"></div>
        <div class="ticket-actions"><button class="control primary" id="ticketNext" disabled>下一题 →</button></div>
      </div>
      <div id="ticketResult" class="ticket-result hidden">
        <div class="ticket-icon">🎫</div><h2>检核完成</h2>
        <div class="ticket-score" id="ticketScore"></div>
        <div class="ticket-status" id="ticketStatus"></div>
        <div class="ticket-detail" id="ticketDetail"></div>
        <div class="save-status" id="ticketSaveStatus"></div>
        <button class="again" id="ticketAgain">再做一次</button>
      </div>
    </div>
  </section>

  <section id="leaderboard" class="panel">
    <div class="leader-grid">
    <div class="leader-card">
      <div class="leader-head">
        <div><div class="leader-title">🎮 配对游戏排行榜</div><div class="leader-note">各难度保留最高分</div><div class="weight-note">综合分＝简单 20%＋中等 30%＋困难 50%</div></div>
        <button class="refresh-btn" id="refreshLeaderboard">↻ 更新排行</button>
      </div>
      <div id="gameLeaderStatus" class="leader-status">正在读取排行榜……</div>
      <div id="gameLeaderTableWrap" class="leader-table-wrap hidden">
        <table class="leader-table">
          <thead><tr><th>名次</th><th>姓名</th><th>综合分</th><th>简单</th><th>中等</th><th>困难</th></tr></thead>
          <tbody id="gameLeaderBody"></tbody>
        </table>
      </div>
    </div>
    <div class="leader-card">
      <div class="leader-head"><div><div class="leader-title">🎫 离堂小检核排行榜</div><div class="leader-note">每位学生只显示最高分</div></div></div>
      <div id="ticketLeaderStatus" class="leader-status">正在读取排行榜……</div>
      <div id="ticketLeaderTableWrap" class="leader-table-wrap hidden">
        <table class="leader-table">
          <thead><tr><th>名次</th><th>姓名</th><th>最高分</th></tr></thead>
          <tbody id="ticketLeaderBody"></tbody>
        </table>
      </div>
    </div>
    </div>
  </section>
</main>

<script>
const flashCards = [
  {name:"整个",number:"1",note:"完整 1 个",parts:1,taken:1},
  {name:"一半",number:"1/2",note:"两份中的 1 份",parts:2,taken:1},
  {name:"二分之一",number:"1/2",note:"2 份取 1 份",parts:2,taken:1},
  {name:"四分之一",number:"1/4",note:"4 份取 1 份",parts:4,taken:1},
  {name:"四分之二",number:"2/4",note:"4 份取 2 份",parts:4,taken:2},
  {name:"四分之三",number:"3/4",note:"4 份取 3 份",parts:4,taken:3}
];
const gameFractions=[
  {key:"1/2",word:"二分之一",parts:2,taken:1},
  {key:"1/4",word:"四分之一",parts:4,taken:1},
  {key:"2/4",word:"四分之二",parts:4,taken:2},
  {key:"3/4",word:"四分之三",parts:4,taken:3}
];

function pictureHTML(type,parts,taken,small=false){
  const size=small?" small":"";
  const art={
    pizza:"🍅  🫒\n 🫑  🍅",cake:"🍓\n✨",watermelon:"•  •\n •  •",chocolate:"▣  ▣\n ▣  ▣",
    orange:"🍊\n✨",pie:"🫐  🫐\n ✨",sandwich:"🥬\n🧀"
  };
  const shape=["cake","chocolate","sandwich"].includes(type)?"rect":"round";
  const pieces=Array.from({length:parts},(_,i)=>`<div class="food-part ${i<taken?"":"empty"}"><span class="food-mark">${art[type]||art.pizza}</span></div>`).join("");
  return `<div class="picture${size}" aria-label="${parts}份中的${taken}份"><div class="food-object ${shape} ${type} parts-${parts}">${pieces}</div></div>`;
}

function fractionHTML(value){
  if(!value.includes("/"))return value;
  const [top,bottom]=value.split("/");
  return `<span class="fraction-stack" aria-label="${bottom}分之${top}"><span class="top">${top}</span><span class="line"></span><span class="bottom">${bottom}</span></span>`;
}

function gameShapeHTML(f,setIndex,itemIndex){
  const shape=(setIndex+itemIndex)%2===0?"circle":"square";
  const shift=(setIndex+itemIndex)%f.parts;
  const active=new Set(Array.from({length:f.taken},(_,i)=>(i+shift)%f.parts));
  const pieces=Array.from({length:f.parts},(_,i)=>`<span class="shape-part ${active.has(i)?"":"empty"}"></span>`).join("");
  return `<span class="game-shape ${shape} parts-${f.parts}" style="--fill:${colors[(setIndex+itemIndex)%colors.length]}" aria-label="${f.word}">${pieces}</span>`;
}

function lookupStudent(){
  const input=document.getElementById("studentNo");
  const no=String(Number(input.value.trim()));
  const display=document.getElementById("studentDisplay");
  const student=STUDENTS[no];
  if(student){
    currentStudent={no,cn:student.cn,en:student.en};
    display.textContent=`✅ ${student.cn}｜${student.en}`;display.classList.remove("error");
    document.getElementById("ticketStudent").textContent=`✅ ${student.cn}`;document.getElementById("ticketStudent").classList.remove("error");
  }else{
    currentStudent=null;display.textContent=input.value.trim()?"找不到这个序号":"请先输入序号";display.classList.toggle("error",Boolean(input.value.trim()));
    document.getElementById("ticketStudent").textContent="请先在上方输入正确序号";
  }
}
document.getElementById("lookupStudent").onclick=lookupStudent;
document.getElementById("studentNo").addEventListener("keydown",e=>{if(e.key==="Enter")lookupStudent()});

document.getElementById("anonymousMode").onchange=e=>{
  const on=e.target.checked,input=document.getElementById("studentNo"),display=document.getElementById("studentDisplay");
  input.disabled=on;document.getElementById("lookupStudent").disabled=on;
  if(on){display.textContent="🕶️ 不记名练习｜不会记录成绩";display.classList.remove("error");document.getElementById("ticketStudent").textContent="🕶️ 不记名练习"}
  else{display.textContent=currentStudent?`✅ ${currentStudent.cn}｜${currentStudent.en}`:"请先输入序号";document.getElementById("ticketStudent").textContent=currentStudent?`✅ ${currentStudent.cn}`:"请先在上方输入序号"}
};

function isAnonymous(){return document.getElementById("anonymousMode").checked}
async function saveResult(result,statusId){
  const status=document.getElementById(statusId);
  if(isAnonymous()){status.textContent="不记名练习：成绩未记录";return}
  if(!currentStudent){status.textContent="未输入有效序号：成绩未记录";return}
  if(!SHEETS_API_URL){status.textContent="Google Sheet 尚未连接：成绩暂未上传";return}
  status.textContent="正在保存成绩……";
  try{
    const response=await fetch(SHEETS_API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...result,studentNo:currentStudent.no})});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    const data=await response.json();
    if(data.error){status.textContent="成绩保存失败，请稍后重试";return}
    status.textContent=data.saved?"✅ 已更新最高成绩":"成绩已收到；最高分保持不变";
  }catch(error){status.textContent="暂时无法保存，请检查网络后重试"}
}

function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
}

async function loadLeaderboard(){
  const gameStatus=document.getElementById("gameLeaderStatus"),gameWrap=document.getElementById("gameLeaderTableWrap");
  const ticketStatus=document.getElementById("ticketLeaderStatus"),ticketWrap=document.getElementById("ticketLeaderTableWrap");
  [gameWrap,ticketWrap].forEach(el=>el.classList.add("hidden"));
  [gameStatus,ticketStatus].forEach(el=>{el.classList.remove("hidden");el.textContent="正在读取排行榜……"});
  if(!SHEETS_API_URL){[gameStatus,ticketStatus].forEach(el=>el.textContent="尚未连接 Google Sheet。");return}
  try{
    const response=await fetch(`${SHEETS_API_URL}?action=leaderboard&t=${Date.now()}`);
    const data=await response.json();
    if(data.error)throw new Error(data.error);
    const gameRows=data.gameLeaderboard||data.leaderboard||[],ticketRows=data.ticketLeaderboard||[];
    const medal=i=>["🥇","🥈","🥉"][i]||i+1;
    if(gameRows.length){
      document.getElementById("gameLeaderBody").innerHTML=gameRows.map((r,i)=>`<tr class="${i<3?"top"+(i+1):""}"><td>${medal(i)}</td><td>${escapeHTML(r.name)}</td><td class="leader-score">${r.score}</td><td class="difficulty-score">${r.easy??"—"}</td><td class="difficulty-score">${r.medium??"—"}</td><td class="difficulty-score">${r.hard??"—"}</td></tr>`).join("");
      gameStatus.classList.add("hidden");gameWrap.classList.remove("hidden");
    }else gameStatus.textContent="还没有配对游戏成绩。";
    if(ticketRows.length){
      document.getElementById("ticketLeaderBody").innerHTML=ticketRows.map((r,i)=>`<tr class="${i<3?"top"+(i+1):""}"><td>${medal(i)}</td><td>${escapeHTML(r.name)}</td><td class="leader-score">${r.score}</td></tr>`).join("");
      ticketStatus.classList.add("hidden");ticketWrap.classList.remove("hidden");
    }else ticketStatus.textContent="还没有离堂小检核成绩。";
  }catch(error){[gameStatus,ticketStatus].forEach(el=>el.textContent="暂时无法读取排行榜，请检查网络。");}
}
document.getElementById("refreshLeaderboard").onclick=loadLeaderboard;

function shuffle(a){
  const copy=[...a];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy;
}
let chosenLeft=null,chosenRight=null,matches=0,locked=false,level="easy",groupIndex=0,wrongAttempts=0,gameStartedAt=Date.now();
const levelInfo={
  easy:{instruction:"点图形，再点分数文字。",left:"shape",right:"word"},
  medium:{instruction:"点图形，再点分数数字。",left:"shape",right:"number"},
  hard:{instruction:"点分数文字，再点分数数字。",left:"word",right:"number"}
};

function itemHTML(f,kind,setIndex,itemIndex,side){
  let content="";
  if(kind==="shape")content=gameShapeHTML(f,setIndex,itemIndex);
  if(kind==="word")content=`<span class="word-label">${f.word}</span>`;
  if(kind==="number")content=`<span class="fraction-label">${fractionHTML(f.key)}</span>`;
  return `<button class="match-item ${side}-choice" data-key="${f.key}">${content}</button>`;
}

function newGame(){
  matches=0;wrongAttempts=0;gameStartedAt=Date.now();chosenLeft=null;chosenRight=null;locked=false;
  document.getElementById("finish").classList.add("hidden");
  document.getElementById("board").classList.remove("hidden");
  document.getElementById("gameMessage").textContent="";
  document.getElementById("gameSaveStatus").textContent="";
  document.getElementById("instruction").textContent=levelInfo[level].instruction;
  document.getElementById("groupPill").textContent=`第 ${groupIndex+1} / 10 组`;
  updateScore();
  const leftItems=shuffle(gameFractions);
  const rightItems=shuffle(gameFractions);
  document.getElementById("board").innerHTML=`
    <div class="match-column" aria-label="左边配对项目">
      ${leftItems.map((f,i)=>itemHTML(f,levelInfo[level].left,groupIndex,i,"left")).join("")}
    </div>
    <div class="match-column" aria-label="右边配对项目">
      ${rightItems.map((f,i)=>itemHTML(f,levelInfo[level].right,groupIndex,i,"right")).join("")}
    </div>`;
  document.querySelectorAll(".left-choice").forEach(el=>el.onclick=()=>selectItem(el,"left"));
  document.querySelectorAll(".right-choice").forEach(el=>el.onclick=()=>selectItem(el,"right"));
}
function selectItem(el,kind){
  if(locked||el.classList.contains("matched"))return;
  const old=kind==="left"?chosenLeft:chosenRight;
  if(old)old.classList.remove("selected");
  el.classList.add("selected");
  if(kind==="left")chosenLeft=el;else chosenRight=el;
  if(chosenLeft&&chosenRight)checkMatch();
}
function checkMatch(){
  locked=true;
  if(chosenLeft.dataset.key===chosenRight.dataset.key){
    chosenLeft.classList.remove("selected");chosenRight.classList.remove("selected");
    chosenLeft.classList.add("matched");chosenRight.classList.add("matched");
    matches++;updateScore();document.getElementById("gameMessage").textContent="✅ 配对成功！";
    chosenLeft=null;chosenRight=null;locked=false;
    if(matches===4)setTimeout(finishGame,550);
  }else{
    wrongAttempts++;
    chosenLeft.classList.add("wrong");chosenRight.classList.add("wrong");
    document.getElementById("gameMessage").textContent="再看一看 👀";
    setTimeout(()=>{
      chosenLeft.classList.remove("selected","wrong");chosenRight.classList.remove("selected","wrong");
      chosenLeft=null;chosenRight=null;locked=false;
    },650);
  }
}
function updateScore(){document.getElementById("scorePill").textContent=`⭐ ${matches} / 4`}
function finishGame(){
  document.getElementById("board").classList.add("hidden");
  document.getElementById("gameMessage").textContent="";
  document.getElementById("finish").classList.remove("hidden");
  const last=groupIndex===9;
  document.getElementById("finishText").textContent=last?"10 组全部完成！太棒了！":"还有 "+(9-groupIndex)+" 组，加油！";
  document.getElementById("again").textContent=last?"从第 1 组再玩":"下一组 →";
  const gameScore=Math.max(0,100-wrongAttempts*10);
  saveResult({activity:"配对游戏",difficulty:{easy:"简单",medium:"中等",hard:"困难"}[level],group:groupIndex+1,score:gameScore,total:100,wrongAttempts,durationSeconds:Math.round((Date.now()-gameStartedAt)/1000)},"gameSaveStatus");
}
document.querySelectorAll(".difficulty-btn").forEach(btn=>btn.onclick=()=>{
  level=btn.dataset.level;groupIndex=0;
  document.querySelectorAll(".difficulty-btn").forEach(b=>b.classList.toggle("active",b===btn));
  newGame();
});
document.getElementById("again").onclick=()=>{groupIndex=(groupIndex+1)%10;newGame()};

/* 离堂小检核：4 种题型各 1 题 */
const ticketModes=["shape-word","shape-number","word-number","number-word"];
let ticketQuestions=[],ticketIndex=0,ticketSelected=null,ticketAnswers=[],ticketSeed=0,ticketStartedAt=Date.now();

function ticketContent(f,kind,index){
  if(kind==="shape")return gameShapeHTML(f,ticketSeed,index);
  if(kind==="word")return `<span class="word-label">${f.word}</span>`;
  return `<span class="fraction-label">${fractionHTML(f.key)}</span>`;
}

function startTicket(){
  if(!isAnonymous()&&!currentStudent){
    const display=document.getElementById("ticketStudent");display.textContent="请先在上方输入正确序号";display.classList.add("error");return;
  }
  ticketSeed=Math.floor(Math.random()*10);
  ticketStartedAt=Date.now();
  const fractions=shuffle(gameFractions);
  ticketQuestions=shuffle(ticketModes).map((mode,i)=>({mode,f:fractions[i]}));
  ticketIndex=0;ticketAnswers=[];
  document.getElementById("ticketIntro").classList.add("hidden");
  document.getElementById("ticketResult").classList.add("hidden");
  document.getElementById("ticketQuiz").classList.remove("hidden");
  renderTicketQuestion();
}

function renderTicketQuestion(){
  ticketSelected=null;
  const q=ticketQuestions[ticketIndex];
  const [leftKind,rightKind]=q.mode.split("-");
  document.getElementById("ticketCount").textContent=`第 ${ticketIndex+1} / 4 题`;
  document.getElementById("ticketBar").style.width=`${(ticketIndex+1)*25}%`;
  document.getElementById("ticketPrompt").textContent=leftKind==="shape"?"这是什么分数？":"找一样的分数。";
  document.getElementById("ticketStimulus").innerHTML=ticketContent(q.f,leftKind,ticketIndex);
  document.getElementById("ticketOptions").innerHTML=shuffle(gameFractions).map(f=>
    `<button class="ticket-option" data-key="${f.key}">${ticketContent(f,rightKind,ticketIndex)}</button>`
  ).join("");
  const next=document.getElementById("ticketNext");
  next.disabled=true;next.textContent=ticketIndex===3?"交给老师 ✓":"下一题 →";
  document.querySelectorAll(".ticket-option").forEach(el=>el.onclick=()=>{
    document.querySelectorAll(".ticket-option").forEach(x=>x.classList.remove("selected"));
    el.classList.add("selected");ticketSelected=el.dataset.key;next.disabled=false;
  });
}

document.getElementById("ticketNext").onclick=()=>{
  const q=ticketQuestions[ticketIndex];
  ticketAnswers.push({correct:ticketSelected===q.f.key,word:q.f.word});
  ticketIndex++;
  if(ticketIndex<4)renderTicketQuestion();else finishTicket();
};

function finishTicket(){
  const score=ticketAnswers.filter(x=>x.correct).length;
  const name=isAnonymous()?"不记名练习":currentStudent.cn;
  const missed=ticketAnswers.filter(x=>!x.correct).map(x=>x.word);
  document.getElementById("ticketQuiz").classList.add("hidden");
  document.getElementById("ticketResult").classList.remove("hidden");
  document.getElementById("ticketScore").textContent=`${score} / 4`;
  document.getElementById("ticketStatus").textContent=score===4?"✅ 已掌握":score>=3?"👍 基本掌握":"🌱 需要再练";
  const date=new Date().toLocaleDateString("zh-CN");
  document.getElementById("ticketDetail").textContent=`${name}｜${date}`+(missed.length?`｜再练：${missed.join("、")}`:"｜全部答对");
  document.getElementById("ticketSaveStatus").textContent="";
  saveResult({activity:"离堂小检核",difficulty:"综合",group:1,score:score*25,total:100,wrongAttempts:4-score,durationSeconds:Math.round((Date.now()-ticketStartedAt)/1000)},"ticketSaveStatus");
}

document.getElementById("startTicket").onclick=startTicket;
document.getElementById("ticketAgain").onclick=()=>{
  document.getElementById("ticketResult").classList.add("hidden");
  document.getElementById("ticketIntro").classList.remove("hidden");
};
showCard();newGame();
