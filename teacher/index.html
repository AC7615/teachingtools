<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>教师后台｜一年级数学</title>
<style>
:root{--ink:#24324a;--muted:#6d7484;--purple:#6f74ef;--green:#57b777;--orange:#f3a33c;--red:#d85d57;--line:#e5e7ef;--shadow:0 14px 34px rgba(47,55,85,.1)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#f6f1ff,#f7fbff 48%,#eef9f2);color:var(--ink);font-family:"Microsoft YaHei",system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login-page{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:32px;box-shadow:var(--shadow)}.brand{display:flex;gap:12px;align-items:center}.brand-icon{width:58px;height:58px;border-radius:18px;background:#eeefff;display:grid;place-items:center;font-size:30px}.login-card h1{font-size:31px;margin:0}.login-card p,.muted{color:var(--muted);font-weight:700;line-height:1.6}.field{display:grid;gap:7px;margin:23px 0 12px}.field label{font-weight:900}.field input,.search{width:100%;border:2px solid #d8dbe7;border-radius:13px;padding:12px 14px;outline:none}.field input:focus,.search:focus{border-color:var(--purple)}.primary,.secondary{border:0;border-radius:13px;padding:12px 17px;font-weight:900}.primary{background:var(--purple);color:#fff}.primary:disabled{opacity:.55;cursor:wait}.secondary{background:#eef0f6;color:var(--ink)}.login-card .primary{width:100%;margin-top:8px}.login-message{min-height:25px;text-align:center;margin-top:12px;font-weight:850;color:var(--red)}.back-link{display:block;text-align:center;margin-top:16px;color:#565bbc;font-weight:800;text-decoration:none}
.app{width:min(1240px,100%);margin:auto;padding:20px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:18px}.topbar h1{margin:0;font-size:clamp(26px,4vw,38px)}.topbar p{margin:4px 0 0}.actions,.nav,.toolbar{display:flex;gap:9px;flex-wrap:wrap}.nav{overflow-x:auto;padding:5px 0 15px}.nav-btn{border:0;border-radius:13px;padding:11px 16px;background:#fff;color:var(--ink);font-weight:900;white-space:nowrap}.nav-btn.active{background:var(--purple);color:#fff}.panel{display:none}.panel.active{display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 6px 18px rgba(47,55,85,.06)}.stat{border-top:5px solid var(--purple)}.stat.green{border-top-color:var(--green)}.stat.orange{border-top-color:var(--orange)}.stat-label{color:var(--muted);font-weight:800}.stat-value{font-size:34px;font-weight:950;margin-top:5px}.stat-note{font-size:13px;color:var(--muted);font-weight:750}.grid-2,.leaderboards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.leaderboards{grid-template-columns:1.35fr .8fr;margin-top:0}.card{border-radius:22px;padding:20px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:15px}.card h2{font-size:23px;margin:0}.progress-row{display:grid;grid-template-columns:72px 1fr 54px;gap:10px;align-items:center;margin:15px 0;font-weight:850}.track{height:12px;border-radius:99px;background:#eceef4;overflow:hidden}.fill{height:100%;border-radius:inherit;background:var(--purple)}.fill.green{background:var(--green)}.fill.orange{background:var(--orange)}
.toolbar{align-items:center;margin-bottom:14px}.search{flex:1;min-width:210px}.recent-choice{display:flex;gap:6px;padding:4px;background:#f0f1f6;border-radius:12px}.recent-choice button{border:0;border-radius:9px;padding:7px 11px;background:transparent;color:var(--muted);font-weight:850}.recent-choice button.active{background:#fff;color:#555ac5;box-shadow:0 2px 7px rgba(47,55,85,.1)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px}.table{width:100%;border-collapse:collapse;min-width:720px}.table th{position:sticky;top:0;background:#f5f6fa;text-align:left;padding:12px;color:var(--muted);font-size:14px}.table td{padding:12px;border-top:1px solid #eceef3;font-weight:750}.table tbody tr:hover{background:#fafaff}.score{display:inline-flex;min-width:50px;justify-content:center;border-radius:9px;padding:5px 8px;background:#eef8f0;color:#24713b;font-weight:950}.score.empty{background:#f1f2f5;color:#969baa}.rank{font-size:20px;font-weight:950;color:var(--purple)}.name-main{font-weight:950}.name-sub,.time{font-size:13px;color:var(--muted)}.rank-1 td{background:#fff8dc}.rank-2 td{background:#f4f6fa}.rank-3 td{background:#fff0e7}.empty-state{text-align:center;padding:40px;color:var(--muted);font-weight:800}.status-bar{text-align:center;padding:10px;font-weight:800;color:var(--muted)}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.grid-2,.leaderboards{grid-template-columns:1fr}}@media(max-width:540px){.app{padding:12px}.login-card{padding:23px}.stats{gap:9px}.stat{padding:14px}.stat-value{font-size:28px}}
</style>
</head>
<body>
<section class="login-page" id="loginPage"><form class="login-card" id="loginForm"><div class="brand"><div class="brand-icon">📊</div><div><h1>教师后台</h1><div class="muted">一年级数学</div></div></div><p>登录后查看班级练习进度、学生最高成绩和排行榜。</p><div class="field"><label for="teacherPassword">教师密码</label><input id="teacherPassword" type="password" minlength="6" maxlength="64" autocomplete="current-password" required placeholder="输入教师密码"></div><button class="primary" id="loginButton" type="submit">登录</button><div class="login-message" id="loginMessage" aria-live="polite"></div><a class="back-link" href="../index.html">← 回到学习网站</a></form></section>
<main class="app hidden" id="dashboard">
<header class="topbar"><div><h1>📊 教师后台</h1><p class="muted" id="updatedText">正在读取数据…</p></div><div class="actions"><button class="secondary" id="refreshButton">↻ 更新</button><button class="secondary" id="exportButton">⬇ 导出 CSV</button><button class="secondary" id="logoutButton">退出</button></div></header>
<nav class="nav" aria-label="教师后台页面"><button class="nav-btn active" data-panel="overview">班级概况</button><button class="nav-btn" data-panel="students">学生成绩</button><button class="nav-btn" data-panel="leaderboards">排行榜</button><button class="nav-btn" data-panel="recent">最近记录</button></nav>
<section class="panel active" id="overview"><div class="stats"><article class="stat"><div class="stat-label">全班人数</div><div class="stat-value" id="totalStudents">—</div><div class="stat-note">Students 名单</div></article><article class="stat green"><div class="stat-label">已参与学生</div><div class="stat-value" id="activeStudents">—</div><div class="stat-note">至少有一项成绩</div></article><article class="stat orange"><div class="stat-label">配对加权平均</div><div class="stat-value" id="gameAverage">—</div><div class="stat-note">简单 20% · 中等 30% · 困难 50%</div></article><article class="stat"><div class="stat-label">离堂检核平均</div><div class="stat-value" id="ticketAverage">—</div><div class="stat-note">每位学生最高成绩</div></article></div><div class="grid-2"><article class="card"><div class="card-head"><h2>配对游戏完成情况</h2><span class="muted">按难度</span></div><div id="gameProgress"></div></article><article class="card"><div class="card-head"><h2>离堂小检核</h2><span class="muted">完成率</span></div><div id="ticketProgress"></div></article></div></section>
<section class="panel" id="students"><article class="card"><div class="card-head"><h2>学生最高成绩</h2><span class="muted" id="studentCount"></span></div><div class="toolbar"><input class="search" id="studentSearch" type="search" placeholder="搜寻序号、中文名或英文名"><button class="secondary" id="onlyIncomplete">只看未完成</button></div><div class="table-wrap"><table class="table"><thead><tr><th>序号</th><th>学生</th><th>简单</th><th>中等</th><th>困难</th><th>离堂检核</th><th>最近练习</th></tr></thead><tbody id="studentRows"></tbody></table></div></article></section>
<section class="panel" id="leaderboards"><div class="leaderboards"><article class="card"><div class="card-head"><h2>🎮 配对游戏排行榜</h2><span class="muted">加权总分</span></div><div class="table-wrap"><table class="table"><thead><tr><th>排名</th><th>学生</th><th>简单</th><th>中等</th><th>困难</th><th>总分</th></tr></thead><tbody id="gameLeaderRows"></tbody></table></div></article><article class="card"><div class="card-head"><h2>🎫 离堂检核</h2><span class="muted">最高分</span></div><div class="table-wrap"><table class="table"><thead><tr><th>排名</th><th>学生</th><th>成绩</th></tr></thead><tbody id="ticketLeaderRows"></tbody></table></div></article></div></section>
<section class="panel" id="recent"><article class="card"><div class="card-head"><h2>最近成绩更新</h2><div class="recent-choice" aria-label="显示记录数量"><button class="active" type="button" data-recent-limit="20">最近20笔</button><button type="button" data-recent-limit="all">全部记录</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>序号</th><th>学生</th><th>活动</th><th>难度</th><th>成绩</th><th>用时</th></tr></thead><tbody id="recentRows"></tbody></table></div></article></section><div class="status-bar" id="statusBar" aria-live="polite"></div>
</main>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbywytTHCDjJnRskGaP-Ls2Q4XLZMwWnl0MAofy-zyH6qjPNEb9WmNKQzMIPjStd4y0H/exec";let teacherToken=sessionStorage.getItem("year1TeacherToken")||"",dashboardData=null,showOnlyIncomplete=false,recentLimit=20;
async function postApi(payload){const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});if(!response.ok)throw new Error("network");return response.json()}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function formatTime(v){if(!v)return"—";const d=new Date(v);return isNaN(d)?"—":d.toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}function duration(v){const s=Number(v)||0;return s?(s>=60?`${Math.floor(s/60)}分${s%60}秒`:`${s}秒`):"—"}function scoreCell(v){return v?`<span class="score">${v.score}</span>`:`<span class="score empty">—</span>`}function rankIcon(v){return v===1?"🥇":v===2?"🥈":v===3?"🥉":v}function errorText(v){return({teacher_access_not_configured:"教师后台尚未启用。",teacher_password_invalid:"教师密码不正确。",teacher_session_invalid:"登录已过期，请重新登录。"})[v]||"暂时无法读取数据。"}
document.getElementById("loginForm").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("loginButton"),m=document.getElementById("loginMessage");b.disabled=true;b.textContent="登录中…";m.textContent="";try{const d=await postApi({action:"teacherLogin",password:document.getElementById("teacherPassword").value});if(!d.ok)throw new Error(d.error);teacherToken=d.teacherToken;sessionStorage.setItem("year1TeacherToken",teacherToken);document.getElementById("teacherPassword").value="";showDashboard();await loadDashboard()}catch(x){m.textContent=errorText(x.message)}finally{b.disabled=false;b.textContent="登录"}};
function showDashboard(){document.getElementById("loginPage").classList.add("hidden");document.getElementById("dashboard").classList.remove("hidden")}function showLogin(m=""){teacherToken="";dashboardData=null;sessionStorage.removeItem("year1TeacherToken");document.getElementById("dashboard").classList.add("hidden");document.getElementById("loginPage").classList.remove("hidden");document.getElementById("loginMessage").textContent=m}
async function loadDashboard(){const s=document.getElementById("statusBar"),b=document.getElementById("refreshButton");s.textContent="正在更新…";b.disabled=true;try{const d=await postApi({action:"teacherDashboard",teacherToken});if(!d.ok)throw new Error(d.error);dashboardData=d;renderAll();s.textContent="已更新"}catch(x){if(x.message==="teacher_session_invalid")return showLogin(errorText(x.message));s.textContent=errorText(x.message)}finally{b.disabled=false}}
function renderAll(){const s=dashboardData.stats||{},t=s.totalStudents||0;document.getElementById("totalStudents").textContent=t;document.getElementById("activeStudents").textContent=s.activeStudents||0;document.getElementById("gameAverage").textContent=`${s.gameAverage||0}分`;document.getElementById("ticketAverage").textContent=`${s.ticketAverage||0}分`;document.getElementById("updatedText").textContent=`最后更新：${formatTime(dashboardData.generatedAt)}`;const p=(n,v,c="")=>`<div class="progress-row"><span>${n}</span><div class="track"><div class="fill ${c}" style="width:${t?Math.round(v/t*100):0}%"></div></div><span>${v}/${t}</span></div>`;document.getElementById("gameProgress").innerHTML=p("简单",s.easyCompleted||0)+p("中等",s.mediumCompleted||0,"green")+p("困难",s.hardCompleted||0,"orange");document.getElementById("ticketProgress").innerHTML=p("已完成",s.ticketCompleted||0,"green")+`<p class="muted">尚未完成：${Math.max(0,t-(s.ticketCompleted||0))} 人</p>`;renderStudents();renderLeaders();renderRecent()}
function renderStudents(){if(!dashboardData)return;const q=document.getElementById("studentSearch").value.trim().toLowerCase(),all=dashboardData.students||[],rows=all.filter(s=>(!q||`${s.studentNo} ${s.chineseName} ${s.englishName}`.toLowerCase().includes(q))&&(!showOnlyIncomplete||!(s.easy&&s.medium&&s.hard&&s.ticket)));document.getElementById("studentCount").textContent=`显示 ${rows.length} / ${all.length} 人`;document.getElementById("studentRows").innerHTML=rows.length?rows.map(s=>`<tr><td>${esc(s.studentNo)}</td><td><div class="name-main">${esc(s.chineseName||"—")}</div><div class="name-sub">${esc(s.englishName)}</div></td><td>${scoreCell(s.easy)}</td><td>${scoreCell(s.medium)}</td><td>${scoreCell(s.hard)}</td><td>${scoreCell(s.ticket)}</td><td class="time">${formatTime(s.lastActive)}</td></tr>`).join(""):`<tr><td colspan="7"><div class="empty-state">没有符合条件的学生</div></td></tr>`}
function renderLeaders(){const g=dashboardData.gameLeaderboard||[],t=dashboardData.ticketLeaderboard||[];document.getElementById("gameLeaderRows").innerHTML=g.length?g.map(r=>`<tr class="rank-${r.rank}"><td class="rank">${rankIcon(r.rank)}</td><td class="name-main">${esc(r.name)}</td><td>${r.easy??"—"}</td><td>${r.medium??"—"}</td><td>${r.hard??"—"}</td><td><span class="score">${r.score}</span></td></tr>`).join(""):`<tr><td colspan="6"><div class="empty-state">暂无成绩</div></td></tr>`;document.getElementById("ticketLeaderRows").innerHTML=t.length?t.map(r=>`<tr class="rank-${r.rank}"><td class="rank">${rankIcon(r.rank)}</td><td class="name-main">${esc(r.name)}</td><td><span class="score">${r.score}</span></td></tr>`).join(""):`<tr><td colspan="3"><div class="empty-state">暂无成绩</div></td></tr>`}
function renderRecent(){const all=dashboardData.recent||[],r=recentLimit==="all"?all:all.slice(0,20);document.getElementById("recentRows").innerHTML=r.length?r.map(x=>`<tr><td class="time">${formatTime(x.updatedAt)}</td><td>${esc(x.studentNo)}</td><td class="name-main">${esc(x.name)}</td><td>${esc(x.activity)}</td><td>${esc(x.difficulty)}</td><td><span class="score">${x.score}</span></td><td>${duration(x.duration)}</td></tr>`).join(""):`<tr><td colspan="7"><div class="empty-state">暂无成绩</div></td></tr>`}
function exportCsv(){if(!dashboardData)return;const c=v=>`"${String(v??"").replace(/"/g,'""')}"`,lines=[["序号","中文名","英文名","班级","简单","中等","困难","离堂小检核","最近练习"],...dashboardData.students.map(s=>[s.studentNo,s.chineseName,s.englishName,s.className,s.easy?.score??"",s.medium?.score??"",s.hard?.score??"",s.ticket?.score??"",s.lastActive?new Date(s.lastActive).toLocaleString("zh-CN"):""])],blob=new Blob(["\ufeff"+lines.map(r=>r.map(c).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`一年级数学成绩_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url)}
document.querySelectorAll(".nav-btn").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav-btn").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id===b.dataset.panel))});document.querySelectorAll("[data-recent-limit]").forEach(b=>b.onclick=()=>{recentLimit=b.dataset.recentLimit==="all"?"all":20;document.querySelectorAll("[data-recent-limit]").forEach(x=>x.classList.toggle("active",x===b));renderRecent()});document.getElementById("studentSearch").oninput=renderStudents;document.getElementById("onlyIncomplete").onclick=e=>{showOnlyIncomplete=!showOnlyIncomplete;e.currentTarget.textContent=showOnlyIncomplete?"显示全部":"只看未完成";renderStudents()};document.getElementById("refreshButton").onclick=loadDashboard;document.getElementById("exportButton").onclick=exportCsv;document.getElementById("logoutButton").onclick=()=>showLogin("已安全退出。");if(teacherToken){showDashboard();loadDashboard()}
</script></body></html>
